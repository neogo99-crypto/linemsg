<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ลงทะเบียนเข้าสู่ระบบพิเศษ</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'ChulaCharasNew', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #f4f7f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.05);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    h2 {
      color: #2c3e50;
      margin-top: 0;
      margin-bottom: 8px;
      font-size: 22px;
    }
    p {
      color: #7f8c8d;
      font-size: 14px;
      margin-bottom: 24px;
      line-height: 1.4;
    }
    .input-group {
      text-align: left;
      margin-bottom: 20px;
    }
    label {
      font-size: 13px;
      color: #34495e;
      font-weight: bold;
      display: block;
      margin-bottom: 8px;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #dcdde1;
      border-radius: 8px;
      font-size: 15px;
      background-color: #f8f9fa;
      color: #2c3e50;
      transition: all 0.3s ease;
    }
    input:disabled {
      background-color: #f1f2f6;
      color: #7f8c8d;
      cursor: not-allowed;
    }
    button {
      width: 100%;
      padding: 14px;
      background-color: #2ecc71;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s ease;
      margin-top: 10px;
      box-shadow: 0 4px 12px rgba(46, 204, 113, 0.2);
    }
    button:hover {
      background-color: #27ae60;
    }
    button:disabled {
      background-color: #bdc3c7;
      color: #7f8c8d;
      cursor: not-allowed;
      box-shadow: none;
    }
    #loading {
      display: none;
      color: #2980b9;
      font-weight: bold;
      font-size: 14px;
      margin-top: 15px;
    }
    #result {
      margin-top: 20px;
      font-weight: bold;
      font-size: 14px;
      padding: 12px;
      border-radius: 8px;
      display: none;
      line-height: 1.4;
    }
    .success-box {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .error-box {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
  </style>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>

<div class="card">
  <h2>🌟 ลงทะเบียนระบบพิเศษ</h2>
  <p>ระบบตรวจสอบสิทธิ์คำเชิญอัตโนมัติ<br>กรุณากดยืนยันเพื่อบันทึกข้อมูลสมาชิก</p>
  
  <div class="input-group">
    <label>ชื่อผู้ใช้งาน LINE</label>
    <input type="text" id="displayName" disabled placeholder="⏳ กำลังโหลดชื่อโปรไฟล์ของคุณ...">
  </div>
  
  <div class="input-group">
    <label>รหัสเชิญลงทะเบียน (Invite Code)</label>
    <input type="text" id="inviteCode" disabled placeholder="⏳ กำลังตรวจสอบรหัสเชิญ...">
  </div>

  <button id="btnSubmit" onclick="submitRegistration()" disabled>⏳ กำลังโหลดระบบ LINE Login...</button>
  <div id="loading">⏳ กำลังบันทึกข้อมูลลงฐานข้อมูล กรุณารอสักครู่...</div>
  <div id="result"></div>
</div>

<script>
  // ⚙️ ลิงก์เชื่อมต่อหลังบ้าน Google Apps Script (ฝังไว้เรียบร้อยแล้ว)
  const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxODPIHs3VFnpPZF0103EM4RmHdQz5JWHcJkdFihus-F8ddv7HrhSs5VHSxhfm4RBlL/exec"; 

  let currentUserId = "";
  let currentDisplayName = "";

  // ฟังก์ชันหลักแสดงผลเมื่อโหลดหน้าเว็บ
  async function main() {
    try {
      // 1. เริ่มต้นระบบ LIFF 
      await liff.init({ liffId: "2010508243-yDObVUty" });
      
      let codeParam = "";
      
      // 🔍 ก๊อกที่ 1: แกะรหัสผ่าน URL ปกติของเบราว์เซอร์
      const urlParams = new URLSearchParams(window.location.search);
      codeParam = urlParams.get('code') || '';
      
      // 🔍 ก๊อกที่ 2: แกะผ่านระบบหน้าต่างจำลองภายในแอป LINE LIFF (getSearchInWindow)
      if (!codeParam) {
        const liffSearch = liff.getSearchInWindow();
        if (liffSearch) {
          const liffUrlParams = new URLSearchParams(liffSearch);
          codeParam = liffUrlParams.get('code') || '';
        }
      }
      
      // 🔍 ก๊อกที่ 3: ดักแกะกรณี LINE นำพารามิเตอร์ไปซ่อนไว้หลังเครื่องหมาย # (Hash Query)
      if (!codeParam && window.location.hash) {
        const hashQuery = window.location.hash.substring(window.location.hash.indexOf('?'));
        if (hashQuery.includes('?')) {
          const hashParams = new URLSearchParams(hashQuery);
          codeParam = hashParams.get('code') || '';
        }
      }

      // นำค่ารหัสเชิญที่ดักจับได้ใส่ลงในกล่องฟอร์ม
      if (codeParam && codeParam.trim() !== "") {
        document.getElementById('inviteCode').value = codeParam.trim();
      } else {
        document.getElementById('inviteCode').value = "ไม่พบรหัสเชิญ";
        showResult("❌ ไม่พบรหัสเชิญในลิงก์สมัครสมาชิก กรุณาตรวจสอบลิงก์ของคุณอีกครั้ง", false);
        return;
      }

      // 2. ตรวจสอบสถานะการล็อกอิน LINE
      if (!liff.isLoggedIn()) {
        // หากเปิดนอกแอปหรือยังไม่ล็อกอิน ให้สั่ง Redirect ไปหน้าจอ Login ตัวเต็มทันที
        liff.login();
      } else {
        // ดึงข้อมูลโปรไฟล์ผู้ใช้งานเมื่อล็อกอินผ่านแล้ว
        const profile = await liff.getProfile();
        currentUserId = profile.userId;
        currentDisplayName = profile.displayName;
        
        document.getElementById('displayName').value = currentDisplayName;
        
        // เปิดสิทธิ์การใช้งานปุ่มสมัครสมาชิก
        const btn = document.getElementById('btnSubmit');
        btn.disabled = false;
        btn.innerText = "✅ ยืนยันการลงทะเบียน";
      }
    } catch (error) {
      showResult("❌ ระบบล็อกอินขัดข้อง: " + error, false);
    }
  }

  // ฟังก์ชันยิงส่งข้อมูลข้ามค่ายไปหา Google Sheet (โหมด URL-Encoded หลบภัย CORS บล็อก)
  function submitRegistration() {
    const code = document.getElementById('inviteCode').value.trim();
    
    // ล็อกปุ่มป้องกันการกดซ้ำ และแสดงสถานะกำลังโหลด
    document.getElementById('btnSubmit').disabled = true;
    document.getElementById('loading').style.display = 'block';
    document.getElementById('result').style.display = 'none';

    // เตรียมฟอร์มข้อมูลแบบมาตรฐานเพื่อคุยกับ doPost(e)
    const searchParams = new URLSearchParams();
    searchParams.append("action", "register");
    searchParams.append("userId", currentUserId);
    searchParams.append("displayName", currentDisplayName);
    searchParams.append("code", code);

    // ยิงข้อมูลข้ามค่ายไปยังฝั่งเซิร์ฟเวอร์ Google Apps Script
    fetch(GAS_WEB_APP_URL, {
      method: "POST",
      mode: "no-cors", // ใช้โหมดไม่ตรวจสอบสิทธิ์ความปลอดภัยข้ามเว็บ เพื่อไม่ให้สคริปต์หน้าบ้านค้างพัง
      headers: {
        "Content-Type": "application/x-www-form-urlencoded"
      },
      body: searchParams.toString()
    })
    .then(() => {
      document.getElementById('loading').style.display = 'none';
      showResult("🎉 ส่งข้อมูลลงทะเบียนสำเร็จ! ระบบบันทึกข้อมูลเรียบร้อยแล้ว หน้าต่างนี้จะปิดลงอัตโนมัติ...", true);
      
      // หน่วงเวลา 2.5 วินาทีเพื่อให้ผู้ใช้อ่านผลลัพธ์ แล้วสั่งปิดหน้าต่างแอป LIFF ในไลน์ทันที
      setTimeout(() => { 
        liff.closeWindow(); 
      }, 2500);
    })
    .catch(error => {
      document.getElementById('loading').style.display = 'none';
      showResult("❌ เกิดข้อผิดพลาดในระบบส่งข้อมูล: " + error, false);
      document.getElementById('btnSubmit').disabled = false;
    });
  }

  // ฟังก์ชันเสริมสำหรับควบคุมกล่องแสดงข้อความแจ้งเตือนสถานะ
  function showResult(message, isSuccess) {
    const resultDiv = document.getElementById('result');
    resultDiv.innerHTML = message;
    resultDiv.style.display = 'block';
    if (isSuccess) {
      resultDiv.className = 'success-box';
    } else {
      resultDiv.className = 'error-box';
    }
  }

  // สั่งรันฟังก์ชันหลักเมื่อเปิดหน้าเว็บ
  main();
</script>
</body>
</html>
