<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LINE Member System</title>
  <!-- เรียกใช้ style2.css -->
  <link rel="stylesheet" href="style2.css">
  <!-- LINE LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>

  <div class="app-container">

    <!-- Card 1: ฟอร์มข้อมูลผู้ใช้ -->
    <div class="card-glass">
      
      <!-- Loading Overlay -->
      <div id="loading" class="loading-overlay">
        <div class="spinner"></div>
        <p id="loading-text" style="margin-top: 12px; font-size: 0.85rem; color: #cbd5e1;">กำลังเชื่อมต่อ LINE...</p>
      </div>

      <!-- Header Profile -->
      <div class="profile-header">
        <div class="avatar-wrapper">
          <img id="user-picture" src="https://via.placeholder.com/100" alt="Profile" class="avatar-img">
          <span class="line-badge">LINE</span>
        </div>
        <h2 id="user-display-name" class="user-title">กำลังโหลด...</h2>
        <p id="user-id" class="user-subtext">LINE ID: -</p>
      </div>

      <!-- Form Section -->
      <form id="profile-form">
        <div class="form-group">
          <label class="form-label">ชื่อ - นามสกุลจริง</label>
          <input type="text" id="input-name" class="form-control" placeholder="กรอกชื่อ-นามสกุล" required>
        </div>

        <div style="display: flex; gap: 12px;">
          <div class="form-group" style="flex: 1;">
            <label class="form-label">เลขห้อง / Room ID</label>
            <input type="text" id="input-roomid" class="form-control" placeholder="เช่น A101">
          </div>
          <div class="form-group" style="flex: 1;">
            <label class="form-label">ชื่อห้อง / Room Name</label>
            <input type="text" id="input-roomname" class="form-control" placeholder="เช่น ตึก A">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">อีเมล</label>
          <input type="email" id="input-email" class="form-control" placeholder="example@email.com" required>
        </div>

        <div class="form-group">
          <label class="form-label">เบอร์โทรศัพท์</label>
          <input type="tel" id="input-tel" class="form-control" placeholder="08XXXXXXXX" required>
        </div>

        <div class="form-group">
          <label class="form-label">ข้อมูลเพิ่มเติม / Other</label>
          <textarea id="input-other" class="form-control" rows="2" placeholder="รายละเอียดเพิ่มเติม..."></textarea>
        </div>

        <button type="submit" class="btn-primary">บันทึกข้อมูล</button>
      </form>

      <div id="alert-box" class="alert-box hidden"></div>
    </div>

    <!-- Card 2: รายชื่อเพื่อนๆ ในระบบ -->
    <div class="card-glass">
      <div class="section-title">
        <span>สมาชิกในระบบ</span>
        <button onclick="loadAllUsers()" style="background:none; border:none; color:#10b981; cursor:pointer; font-size:0.85rem;">🔄 รีเฟรช</button>
      </div>
      <div id="member-list" class="member-list">
        <p style="text-align: center; color: #64748b; font-size: 0.85rem;">กำลังโหลดรายชื่อ...</p>
      </div>
    </div>

  </div>

  <script>
    // =========================================================
    // CONFIGURATION (ใส่ค่าจริงของคุณที่นี่)
    // =========================================================
    const MY_LIFF_ID = "2011072958-I6rWrpSd"; // นำ LIFF ID จาก LINE Developers Console มาวางที่นี่
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxUkUbsSiomTHXrAY1KhA3LTEPXwEW0_yaURw1pmPifXhKQDUWX8gYmt9Exme593jdg/exec";
    // =========================================================

    let lineProfile = {};

    window.addEventListener("load", () => {
      initLiff();
    });

    async function initLiff() {
      try {
        await liff.init({ liffId: MY_LIFF_ID });

        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        lineProfile = await liff.getProfile();

        // แสดงโปรไฟล์ LINE
        document.getElementById("user-display-name").innerText = lineProfile.displayName || "ผู้ใช้งาน";
        document.getElementById("user-id").innerText = `ID: ${lineProfile.userId}`;
        if (lineProfile.pictureUrl) {
          document.getElementById("user-picture").src = lineProfile.pictureUrl;
        }

        // โหลดข้อมูลตนเอง และเพื่อนๆ ทั้งหมด
        await fetchUserData(lineProfile.userId);
        await loadAllUsers();

      } catch (err) {
        console.error("LIFF Init Error:", err);
        showAlert("เกิดข้อผิดพลาดในการเชื่อมต่อ LINE: " + err.message, "error");
        setLoading(false);
      }
    }

    // ดึงข้อมูลส่วนตัวจาก GAS
    async function fetchUserData(userId) {
      setLoading(true, "กำลังดึงข้อมูลสมาชิก...");
      try {
        const response = await fetch(`${GAS_WEB_APP_URL}?action=getUser&userId=${encodeURIComponent(userId)}`);
        const result = await response.json();

        if (result.status === "success" && result.data) {
          const d = result.data;
          document.getElementById("input-roomid").value = d.roomid || "";
          document.getElementById("input-roomname").value = d.roomname || "";
          document.getElementById("input-name").value = d.name || lineProfile.displayName || "";
          document.getElementById("input-email").value = d.email || "";
          document.getElementById("input-tel").value = d.tel || "";
          document.getElementById("input-other").value = d.other || "";
          showAlert("โหลดข้อมูลสำเร็จ", "success");
        } else {
          document.getElementById("input-name").value = lineProfile.displayName || "";
          showAlert("ลงทะเบียนใหม่ กรุณากรอกข้อมูล", "info");
        }
      } catch (err) {
        console.error(err);
        showAlert("ไม่สามารถดึงข้อมูลส่วนตัวได้", "error");
      } finally {
        setLoading(false);
      }
    }

    // ดึงรายชื่อสมาชิกทั้งหมดมาแสดง
    async function loadAllUsers() {
      const listEl = document.getElementById("member-list");
      try {
        const response = await fetch(`${GAS_WEB_APP_URL}?action=getAllUsers`);
        const result = await response.json();

        if (result.status === "success" && result.data.length > 0) {
          listEl.innerHTML = result.data.map(u => `
            <div class="member-item">
              <img src="${u.img || 'https://via.placeholder.com/100'}" class="member-avatar">
              <div class="member-info">
                <p class="member-name">${u.name || u.display || 'ไม่ระบุชื่อ'}</p>
                <p class="member-detail">ห้อง: ${u.roomid || '-'} ${u.roomname ? '('+u.roomname+')' : ''}</p>
                <p class="member-detail">โทร: ${u.tel || '-'}</p>
              </div>
            </div>
          `).join('');
        } else {
          listEl.innerHTML = `<p style="text-align: center; color: #64748b; font-size: 0.85rem;">ยังไม่มีสมาชิกในระบบ</p>`;
        }
      } catch (err) {
        listEl.innerHTML = `<p style="text-align: center; color: #ef4444; font-size: 0.85rem;">โหลดข้อมูลล้มเหลว</p>`;
      }
    }

    // บันทึกข้อมูล
    document.getElementById("profile-form").addEventListener("submit", async (e) => {
      e.preventDefault();

      if (!lineProfile.userId) {
        showAlert("ไม่พบ LINE User ID", "error");
        return;
      }

      setLoading(true, "กำลังบันทึกข้อมูล...");

      const payload = {
        roomid: document.getElementById("input-roomid").value.trim(),
        roomname: document.getElementById("input-roomname").value.trim(),
        userid: lineProfile.userId,
        display: lineProfile.displayName || "",
        name: document.getElementById("input-name").value.trim(),
        email: document.getElementById("input-email").value.trim(),
        tel: document.getElementById("input-tel").value.trim(),
        other: document.getElementById("input-other").value.trim(),
        img: lineProfile.pictureUrl || ""
      };

      try {
        const response = await fetch(GAS_WEB_APP_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (result.status === "success") {
          showAlert("บันทึกข้อมูลลง Google Sheets เรียบร้อย!", "success");
          await loadAllUsers(); // โหลดการ์ดรายชื่อเพื่อนใหม่
        } else {
          showAlert("บันทึกไม่สำเร็จ: " + result.message, "error");
        }
      } catch (err) {
        console.error(err);
        showAlert("เกิดข้อผิดพลาดขณะส่งข้อมูล", "error");
      } finally {
        setLoading(false);
      }
    });

    function setLoading(show, text) {
      const el = document.getElementById("loading");
      if (show) {
        document.getElementById("loading-text").innerText = text || "กำลังโหลด...";
        el.classList.remove("hidden");
      } else {
        el.classList.add("hidden");
      }
    }

    function showAlert(msg, type) {
      const box = document.getElementById("alert-box");
      box.className = `alert-box alert-${type}`;
      box.innerText = msg;
      box.classList.remove("hidden");
    }
  </script>
</body>
</html>
