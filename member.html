<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Message Generator Expert</title>
    <!-- ใช้ Tailwind CSS เพื่อความสวยงามระดับมืออาชีพ -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen py-10 px-4">

    <div class="max-w-4xl mx-auto bg-white rounded-2xl shadow-xl border border-slate-100 overflow-hidden">
        <!-- Header -->
        <div class="bg-slate-900 px-8 py-6 text-white text-center">
            <h1 class="text-2xl font-bold tracking-wide">Course Flex Message Generator</h1>
            <p class="text-slate-400 text-sm mt-1">ดึงข้อมูลจาก Google Sheets และสร้างเป็น LINE Flex Message JSON</p>
        </div>

        <!-- Main Content -->
        <div class="p-8 space-y-6">
            <!-- Configuration Box -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 bg-slate-50 p-6 rounded-xl border border-slate-200">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">Google Web App URL</label>
                    <input type="text" id="webAppUrl" class="w-full px-4 py-2.5 rounded-lg border border-slate-300 bg-slate-100 text-slate-600 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm" value="https://script.google.com/macros/s/AKfycbyCMHF40LmV_8OzSS-eKXge1s269nOvtukZuXpOPATyPDiYjC2gtEAFpOivHdMkXP42/exec" placeholder="วาง Deployment URL ของ Apps Script ที่นี่...">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">เลือก Theme สีสำหรับ Flex Message</label>
                    <select id="themeSelect" class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm bg-white">
                        <option value="blue">💙 Theme สีน้ำเงิน</option>
                        <option value="green">💚 Theme สีเขียว</option>
                        <option value="pink">💗 Theme สีชมพู</option>
                        <option value="red">❤️ Theme สีแดง</option>
                    </select>
                </div>
            </div>

            <!-- Action Box -->
            <div class="flex flex-col sm:flex-row gap-4 items-end bg-white p-4 border border-dashed border-slate-200 rounded-xl">
                <div class="flex-1 w-full">
                    <label class="block text-sm font-medium text-slate-700 mb-2">กรอกรหัสหลักสูตร (Code)</label>
                    <input type="text" id="courseCode" class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm font-semibold" placeholder="ตัวอย่างเช่น: CS101, LINE02">
                </div>
                <button onclick="generateFlexJson()" id="btnSubmit" class="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-8 py-2.5 rounded-lg shadow-md transition-all flex items-center justify-center gap-2">
                    <span>ดึงข้อมูลและสร้าง JSON</span>
                </button>
            </div>

            <!-- Result Box -->
            <div class="space-y-2">
                <div class="flex justify-between items-center">
                    <label class="block text-sm font-semibold text-slate-700">ผลลัพธ์ LINE Flex Message JSON (พร้อมนำไปวางใน Simulator)</label>
                    <button onclick="copyToClipboard()" class="text-xs bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-1.5 rounded transition-all">คัดลอกโค้ด</button>
                </div>
                <textarea id="jsonOutput" readonly class="w-full h-96 p-4 bg-slate-900 text-emerald-400 font-mono text-xs rounded-xl shadow-inner border border-slate-800 leading-relaxed resize-none focus:outline-none" placeholder="// ผลลัพธ์ JSON จะแสดงขึ้นที่นี่หลังจากการประมวลผลสำเร็จ..."></textarea>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        const themeConfig = {
            blue: { main: "#1E40AF", sub: "#EFF6FF", text: "#1E3A8A", badge: "#3B82F6", oddRow: "#F0F4F8", evenRow: "#FFFFFF" },
            green: { main: "#065F46", sub: "#ECFDF5", text: "#064E3B", badge: "#10B981", oddRow: "#E6F4EA", evenRow: "#FFFFFF" },
            pink: { main: "#9D174D", sub: "#FDF2F8", text: "#831843", badge: "#EC4899", oddRow: "#FCE7F3", evenRow: "#FFFFFF" },
            red: { main: "#991B1B", sub: "#FEF2F2", text: "#7F1D1D", badge: "#EF4444", oddRow: "#FEE2E2", evenRow: "#FFFFFF" }
        };

        async function generateFlexJson() {
            const webAppUrl = document.getElementById('webAppUrl').value.trim();
            const courseCode = document.getElementById('courseCode').value.trim();
            const currentTheme = document.getElementById('themeSelect').value;
            const btnSubmit = document.getElementById('btnSubmit');
            const jsonOutput = document.getElementById('jsonOutput');

            if (!webAppUrl) {
                alert('กรุณากรอก Google Web App URL ก่อนครับ');
                return;
            }
            if (!courseCode) {
                alert('กรุณากรอกรหัสหลักสูตรด้วยครับ');
                return;
            }

            btnSubmit.disabled = true;
            btnSubmit.innerText = 'กำลังประมวลผล...';
            jsonOutput.value = '// กำลังดาวน์โหลดและคำนวณโครงสร้าง Flex Message...';

            try {
                const response = await fetch(`${webAppUrl}?code=${encodeURIComponent(courseCode)}`);
                const data = await response.json();

                if (!data.course) {
                    jsonOutput.value = `// ไม่พบข้อมูลหลักสูตรที่ตรงกับรหัส "${courseCode}" ในชีต course ครับ`;
                    btnSubmit.disabled = false;
                    btnSubmit.innerText = 'ดึงข้อมูลและสร้าง JSON';
                    return;
                }

                const theme = themeConfig[currentTheme];
                const members = data.members || [];
                const cards = [];
                const itemsPerPage = 10;
                const totalPages = Math.max(1, Math.ceil(members.length / itemsPerPage));

                for (let page = 0; page < totalPages; page++) {
                    const startIndex = page * itemsPerPage;
                    const endIndex = Math.min(startIndex + itemsPerPage, members.length);
                    const pageMembers = members.slice(startIndex, endIndex);

                    const tableRowsJson = [];

                    if (pageMembers.length > 0) {
                        pageMembers.forEach((member, idx) => {
                            const globalIndex = startIndex + idx + 1;
                            const isOdd = idx % 2 === 0;
                            const rowBgColor = isOdd ? theme.oddRow : theme.evenRow;

                            tableRowsJson.push({
                                "type": "box",
                                "layout": "horizontal",
                                "backgroundColor": rowBgColor,
                                "paddingAll": "xs",
                                "contents": [
                                    { "type": "text", "text": String(globalIndex), "weight": "bold", "size": "xs", "color": "#4A5568", "flex": 1, "align": "center" },
                                    { "type": "text", "text": member.name, "size": "xs", "color": "#2D3748", "flex": 4 },
                                    { "type": "text", "text": member.surname, "size": "xs", "color": "#2D3748", "flex": 5 }
                                ]
                            });
                        });
                    } else {
                        tableRowsJson.push({
                            "type": "box",
                            "layout": "vertical",
                            "paddingAll": "md",
                            "contents": [
                                { "type": "text", "text": "ยังไม่มีรายชื่อผู้เข้าอบรมในขณะนี้", "align": "center", "size": "xs", "color": "#A0AEC0", "style": "italic" }
                            ]
                        });
                    }

                    const bubble = {
                        "type": "bubble",
                        "size": "mega",
                        "header": {
                            "type": "box",
                            "layout": "vertical",
                            "backgroundColor": theme.main,
                            "paddingAll": "lg",
                            "contents": [
                                {
                                    "type": "box",
                                    "layout": "horizontal",
                                    "contents": [
                                        { "type": "text", "text": "COURSE INFO", "color": "#E2E8F0", "size": "xxs", "weight": "bold", "flex": 1 },
                                        { "type": "text", "text": `หน้า ${page + 1}/${totalPages}`, "color": "#E2E8F0", "size": "xxs", "align": "end", "flex": 1 }
                                    ]
                                },
                                { "type": "text", "text": data.course.name || "-", "weight": "bold", "color": "#FFFFFF", "size": "lg", "margin": "md", "wrap": true },
                                {
                                    "type": "box",
                                    "layout": "horizontal",
                                    "margin": "md",
                                    "spacing": "sm",
                                    "contents": [
                                        // ปรับเปลี่ยนจากก้าน icon เดิม มาใช้คอมโพเนนต์ text ร่วมกับ Emoji เพื่อให้ถูกหลักโครงสร้างของ LINE 100%
                                        { "type": "text", "text": "📍", "size": "sm", "flex": 0 },
                                        { "type": "text", "text": data.course.place || "-", "color": "#E2E8F0", "size": "xs", "wrap": true, "flex": 1 }
                                    ]
                                },
                                {
                                    "type": "box",
                                    "layout": "horizontal",
                                    "margin": "sm",
                                    "spacing": "sm",
                                    "contents": [
                                        { "type": "text", "text": "📅", "size": "sm", "flex": 0 },
                                        { "type": "text", "text": data.course.date || "-", "color": "#E2E8F0", "size": "xs", "flex": 0 },
                                        { "type": "text", "text": "  |  ", "color": "#A0AEC0", "size": "xs", "flex": 0 },
                                        { "type": "text", "text": "🕒", "size": "sm", "flex": 0 },
                                        { "type": "text", "text": data.course.time || "-", "color": "#E2E8F0", "size": "xs", "flex": 1 }
                                    ]
                                }
                            ]
                        },
                        "body": {
                            "type": "box",
                            "layout": "vertical",
                            "paddingAll": "md",
                            "backgroundColor": "#FFFFFF",
                            "contents": [
                                {
                                    "type": "box",
                                    "layout": "horizontal",
                                    "backgroundColor": theme.sub,
                                    "paddingAll": "xs",
                                    "contents": [
                                        { "type": "text", "text": "No.", "weight": "bold", "size": "xs", "color": theme.text, "flex": 1, "align": "center" },
                                        { "type": "text", "text": "ชื่อ", "weight": "bold", "size": "xs", "color": theme.text, "flex": 4 },
                                        { "type": "text", "text": "นามสกุล", "weight": "bold", "size": "xs", "color": theme.text, "flex": 5 }
                                    ]
                                },
                                {
                                    "type": "box",
                                    "layout": "vertical",
                                    "margin": "xs",
                                    "contents": tableRowsJson
                                }
                            ]
                        }
                    };

                    cards.push(bubble);
                }

                const flexMessageObj = {
                    "type": "carousel",
                    "contents": cards
                };

                jsonOutput.value = JSON.stringify(flexMessageObj, null, 2);

            } catch (err) {
                jsonOutput.value = `// เกิดข้อผิดพลาดในการเชื่อมต่อ:\n${err.message}\n\nกรุณาตรวจสอบการเชื่อมต่ออินเทอร์เน็ต และตรวจสอบว่าโปรเจกต์ Apps Script ได้เผยแพร่ (Deploy) แบบ Anyone เรียบร้อยแล้ว`;
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.innerText = 'ดึงข้อมูลและสร้าง JSON';
            }
        }

        function copyToClipboard() {
            const textarea = document.getElementById('jsonOutput');
            if (!textarea.value || textarea.value.startsWith('//')) return;
            
            textarea.select();
            document.execCommand('copy');
            alert('คัดลอก JSON ไปยัง Clipboard แล้ว! สามารถนำไปทดสอบที่ LINE Flex Message Simulator ได้ทันที');
        }
    </script>
</body>
</html>
