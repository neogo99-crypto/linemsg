<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบลงทะเบียนและจัดการข้อมูลสมาชิก</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- LINE LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
    body {
      font-family: 'Sarabun', sans-serif;
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">

  <!-- Loading Overlay -->
  <div id="loading" class="fixed inset-0 bg-white bg-opacity-90 z-50 flex flex-col justify-center items-center">
    <div class="animate-spin rounded-full h-12 w-12 border-4 border-green-500 border-t-transparent mb-4"></div>
    <p class="text-gray-600 font-medium">กำลังโหลดข้อมูล...</p>
  </div>

  <div class="max-w-md mx-auto bg-white min-h-screen shadow-md flex flex-col">
    
    <!-- Header Profile Banner -->
    <div class="bg-green-600 text-white p-6 text-center rounded-b-2xl shadow-lg relative">
      <div class="relative inline-block">
        <img id="userPicture" src="https://via.placeholder.com/100" alt="Profile" class="w-20 h-20 rounded-full border-4 border-white mx-auto shadow-md object-cover">
      </div>
      <h1 id="userName" class="text-xl font-bold mt-2">กำลังดึงข้อมูลโปรไฟล์...</h1>
      <p id="userIdDisplay" class="text-xs text-green-100 mt-1 opacity-80"></p>
    </div>

    <!-- Navigation Tabs -->
    <div class="flex border-b border-gray-200 bg-white sticky top-0 z-10">
      <button id="tabMyInfoBtn" onclick="switchTab('myInfo')" class="flex-1 py-3 px-4 text-center font-semibold text-green-600 border-b-2 border-green-600 transition-colors duration-200 flex items-center justify-center gap-2">
        <i class="fa-solid fa-user-pen"></i> ข้อมูลของฉัน
      </button>
      <button id="tabFriendsBtn" onclick="switchTab('friends')" class="flex-1 py-3 px-4 text-center font-semibold text-gray-500 hover:text-green-600 border-b-2 border-transparent transition-colors duration-200 flex items-center justify-center gap-2">
        <i class="fa-solid fa-users"></i> สมาชิกทั้งหมด
      </button>
    </div>

    <!-- Main Content Body -->
    <div class="p-5 flex-1">

      <!-- TAB 1: ข้อมูลของฉัน (กรอก/แก้ไข) -->
      <div id="tabMyInfo" class="block space-y-4">
        
        <div id="statusAlert" class="hidden p-3 rounded-lg text-sm mb-2"></div>

        <form id="profileForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">ชื่อ-นามสกุล / ชื่อเรียก <span class="text-red-500">*</span></label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                <i class="fa-solid fa-signature"></i>
              </span>
              <input type="text" id="displayNameInput" required placeholder="กรอกชื่อของคุณ" class="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 text-sm">
            </div>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">เบอร์โทรศัพท์ <span class="text-red-500">*</span></label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                <i class="fa-solid fa-phone"></i>
              </span>
              <input type="tel" id="phoneInput" required placeholder="08X-XXX-XXXX" pattern="[0-9]{9,10}" class="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 text-sm">
            </div>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">แผนก / ตำแหน่ง / หมายเหตุ</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                <i class="fa-solid fa-briefcase"></i>
              </span>
              <input type="text" id="departmentInput" placeholder="ระบุสังกัด หรือแผนก (ถ้ามี)" class="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 text-sm">
            </div>
          </div>

          <div class="pt-2">
            <button type="submit" id="submitBtn" class="w-full bg-green-600 hover:bg-green-700 text-white font-medium py-2.5 px-4 rounded-lg shadow-md transition duration-200 flex items-center justify-center gap-2">
              <i class="fa-solid fa-floppy-disk"></i> <span id="submitBtnText">บันทึกข้อมูล</span>
            </button>
          </div>
        </form>

        <!-- แสดงสถานะการบันทึกข้อมูลล่าสุดของผู้ใช้ -->
        <div id="existingDataPreview" class="hidden mt-6 p-4 bg-gray-50 border border-gray-200 rounded-lg">
          <h3 class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">ข้อมูลล่าสุดในระบบ</h3>
          <p class="text-sm"><strong>ชื่อ:</strong> <span id="prevName">-</span></p>
          <p class="text-sm"><strong>เบอร์โทร:</strong> <span id="prevPhone">-</span></p>
          <p class="text-sm"><strong>สังกัด/แผนก:</strong> <span id="prevDept">-</span></p>
          <p class="text-xs text-gray-400 mt-2 text-right">อัปเดตล่าสุด: <span id="prevUpdatedAt">-</span></p>
        </div>

      </div>

      <!-- TAB 2: รายชื่อเพื่อน/สมาชิกทั้งหมด -->
      <div id="tabFriends" class="hidden space-y-3">
        <div class="flex justify-between items-center mb-2">
          <h2 class="font-bold text-gray-700 text-sm">สมาชิกที่ลงทะเบียนแล้ว</h2>
          <button onclick="fetchFriendsData(true)" class="text-xs text-green-600 hover:underline flex items-center gap-1">
            <i class="fa-solid fa-rotate"></i> รีเฟรช
          </button>
        </div>

        <div id="friendsLoading" class="hidden py-8 text-center text-gray-500">
          <i class="fa-solid fa-circle-notch animate-spin text-green-600 text-2xl mb-2"></i>
          <p class="text-xs">กำลังโหลดรายชื่อสมาชิก...</p>
        </div>

        <div id="friendsList" class="space-y-2"></div>
      </div>

    </div>
  </div>

  <script>
    // Config: ตั้งค่า LIFF ID และ Web App URL
    const LIFF_ID = "2011072958-I6rWrpSd";
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxUkUbsSiomTHXrAY1KhA3LTEPXwEW0_yaURw1pmPifXhKQDUWX8gYmt9Exme593jdg/exec";

    let currentUserId = "";
    let lineProfile = null;
    let isFriendsLoaded = false;

    // Initial Function
    window.onload = async function() {
      try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }
        
        // ดึง Profile จาก LINE
        lineProfile = await liff.getProfile();
        currentUserId = lineProfile.userId;
        
        // แสดงผลโปรไฟล์บน UI
        document.getElementById('userName').innerText = lineProfile.displayName || "ผู้ใช้งาน LINE";
        document.getElementById('userPicture').src = lineProfile.pictureUrl || 'https://via.placeholder.com/100';
        document.getElementById('userIdDisplay').innerText = `ID: ${lineProfile.userId}`;
        document.getElementById('displayNameInput').value = lineProfile.displayName || '';

        // ดึงข้อมูลของผู้ใช้จาก Google Sheet
        await fetchMyProfileData(currentUserId);

      } catch (err) {
        console.error("LIFF Init Error:", err);
        showAlert("เกิดข้อผิดพลาดในการเชื่อมต่อ LINE: " + err.message, "error");
      } finally {
        document.getElementById('loading').classList.add('hidden');
      }
    };

    // 1. ดึงข้อมูลเฉพาะของผู้ใช้งานปัจจุบัน (Tab 1)
    async function fetchMyProfileData(userId) {
      try {
        const response = await fetch(`${GAS_WEB_APP_URL}?action=getUser&userId=${encodeURIComponent(userId)}`);
        const result = await response.json();

        if (result.status === "success" && result.data) {
          const user = result.data;
          // แมปค่าให้ตรงกับ Key ของ code.gs (name, tel, other)
          document.getElementById('displayNameInput').value = user.name || lineProfile.displayName || '';
          document.getElementById('phoneInput').value = user.tel || '';
          document.getElementById('departmentInput').value = user.other || '';

          // แสดงบล็อก Preview ข้อมูลเดิม
          document.getElementById('prevName').innerText = user.name || '-';
          document.getElementById('prevPhone').innerText = user.tel || '-';
          document.getElementById('prevDept').innerText = user.other || '-';
          document.getElementById('prevUpdatedAt').innerText = user.updatedAt || '-';
          document.getElementById('existingDataPreview').classList.remove('hidden');

          document.getElementById('submitBtnText').innerText = "อัปเดตข้อมูล";
        }
      } catch (error) {
        console.log("ยังไม่มีข้อมูลเดิมในระบบ หรือเกิดข้อผิดพลาด:", error);
      }
    }

    // 2. บันทึก/แก้ไขข้อมูลส่วนตัว
    async function handleFormSubmit(e) {
      e.preventDefault();
      
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerHTML = `<i class="fa-solid fa-circle-notch animate-spin"></i> กำลังบันทึก...`;

      // ปรับ Payload ให้ Key ตรงกับที่ code.gs รอรับ
      const formData = {
        userid: currentUserId,
        display: lineProfile ? lineProfile.displayName : "",
        name: document.getElementById('displayNameInput').value.trim(),
        tel: document.getElementById('phoneInput').value.trim(),
        other: document.getElementById('departmentInput').value.trim(),
        img: lineProfile ? lineProfile.pictureUrl : "",
        email: ""
      };

      try {
        // ส่งแบบ text/plain ป้องกันปัญหาติด CORS
        const response = await fetch(GAS_WEB_APP_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(formData)
        });

        const result = await response.json();

        if (result.status === "success") {
          showAlert("บันทึกข้อมูลเรียบร้อยแล้ว!", "success");
          await fetchMyProfileData(currentUserId);
          isFriendsLoaded = false;
        } else {
          showAlert("เกิดข้อผิดพลาด: " + result.message, "error");
        }
      } catch (error) {
        console.error("Save Error:", error);
        showAlert("ไม่สามารถบันทึกข้อมูลได้ กรุณาลองใหม่อีกครั้ง", "error");
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<i class="fa-solid fa-floppy-disk"></i> <span id="submitBtnText">${document.getElementById('submitBtnText').innerText}</span>`;
      }
    }

    // 3. ดึงข้อมูลสมาชิกทั้งหมด (Tab 2)
    async function fetchFriendsData(forceRefresh = false) {
      if (isFriendsLoaded && !forceRefresh) return;

      const listContainer = document.getElementById('friendsList');
      const loadingSpinner = document.getElementById('friendsLoading');

      loadingSpinner.classList.remove('hidden');
      listContainer.innerHTML = '';

      try {
        const response = await fetch(`${GAS_WEB_APP_URL}?action=getAllUsers`);
        const result = await response.json();

        if (result.status === "success" && result.data.length > 0) {
          listContainer.innerHTML = result.data.map(item => `
            <div class="p-3 bg-white border border-gray-100 rounded-lg shadow-sm flex items-center justify-between">
              <div class="flex items-center space-x-3">
                <img src="${item.img || 'https://via.placeholder.com/40'}" class="w-10 h-10 rounded-full object-cover border" alt="Profile">
                <div>
                  <div class="font-semibold text-sm text-gray-800">
                    ${escapeHtml(item.name || item.display)} 
                    ${item.userid === currentUserId ? '<span class="text-xs bg-green-100 text-green-700 px-1.5 py-0.5 rounded ml-1">(คุณ)</span>' : ''}
                  </div>
                  <div class="text-xs text-gray-500"><i class="fa-solid fa-briefcase text-gray-400 mr-1"></i>${escapeHtml(item.other || 'ไม่ระบุ')}</div>
                </div>
              </div>
              ${item.tel ? `
                <a href="tel:${item.tel}" class="text-green-600 bg-green-50 hover:bg-green-100 p-2 rounded-full transition-colors">
                  <i class="fa-solid fa-phone text-sm"></i>
                </a>
              ` : ''}
            </div>
          `).join('');

          isFriendsLoaded = true;
        } else {
          listContainer.innerHTML = `<div class="text-center py-6 text-gray-400 text-sm">ยังไม่มีสมาชิกคนอื่นลงทะเบียน</div>`;
        }
      } catch (error) {
        console.error("Fetch Friends Error:", error);
        listContainer.innerHTML = `<div class="text-center py-6 text-red-400 text-sm">ไม่สามารถดึงข้อมูลสมาชิกได้</div>`;
      } finally {
        loadingSpinner.classList.add('hidden');
      }
    }

    // Swtich Tab Controller
    function switchTab(tabName) {
      const tabMyInfo = document.getElementById('tabMyInfo');
      const tabFriends = document.getElementById('tabFriends');
      const btnMyInfo = document.getElementById('tabMyInfoBtn');
      const btnFriends = document.getElementById('tabFriendsBtn');

      if (tabName === 'myInfo') {
        tabMyInfo.classList.remove('hidden');
        tabFriends.classList.add('hidden');

        btnMyInfo.classList.add('text-green-600', 'border-green-600');
        btnMyInfo.classList.remove('text-gray-500', 'border-transparent');

        btnFriends.classList.remove('text-green-600', 'border-green-600');
        btnFriends.classList.add('text-gray-500', 'border-transparent');
      } else if (tabName === 'friends') {
        tabMyInfo.classList.add('hidden');
        tabFriends.classList.remove('hidden');

        btnFriends.classList.add('text-green-600', 'border-green-600');
        btnFriends.classList.remove('text-gray-500', 'border-transparent');

        btnMyInfo.classList.remove('text-green-600', 'border-green-600');
        btnMyInfo.classList.add('text-gray-500', 'border-transparent');

        fetchFriendsData();
      }
    }

    // Helper functions
    function showAlert(msg, type) {
      const alertBox = document.getElementById('statusAlert');
      alertBox.innerText = msg;
      alertBox.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'bg-green-100', 'text-green-700');
      
      if (type === 'error') {
        alertBox.classList.add('bg-red-100', 'text-red-700');
      } else {
        alertBox.classList.add('bg-green-100', 'text-green-700');
      }
      
      setTimeout(() => alertBox.classList.add('hidden'), 4000);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }
  </script>
</body>
</html>
